name: genetic-universe-api

on:
  push:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - ".github/workflows/api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,quality]'
      - run: python -m compileall -q app scripts
      - run: ruff check app tests/unit tests/contract tests/integration tests/property
      - run: mypy
      - run: pytest -q
      - run: python scripts/check-openapi.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile apps/api
