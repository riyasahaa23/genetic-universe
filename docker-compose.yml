services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genetic_universe}
      POSTGRES_USER: ${POSTGRES_USER:-genetic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genetic}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - genetic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      GENETIC_ENVIRONMENT: ${GENETIC_ENVIRONMENT:-production}
      GENETIC_HOST: 0.0.0.0
      GENETIC_PORT: 8000
      GENETIC_REPOSITORY_BACKEND: sqlalchemy
      GENETIC_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-genetic}:${POSTGRES_PASSWORD:-genetic}@postgres:5432/${POSTGRES_DB:-genetic_universe}"
      GENETIC_ALLOWED_ORIGINS: ${GENETIC_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      GENETIC_DATA_ROOT: /app/data
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  genetic-postgres-data:
